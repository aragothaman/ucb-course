[project]
name = "ucb-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arun Ragothaman", email = "aragothaman@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[project.scripts]
ucb-course = "ucb_course:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.2",
]
